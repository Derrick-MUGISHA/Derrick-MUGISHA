name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Get Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py
      - name: Commit
        # run even if today.py failed: it saves the partially built LOC cache,
        # so the next run resumes instead of restarting from zero
        if: success() || failure()
        run: |-
          git add .
          git diff
          git config --global user.email "github-actions-bot@derrick-mugisha.github.io"
          git config --global user.name "Derrick-MUGISHA/GitHub-Actions-Bot"
          git commit -m "Updated README" -a || echo "No changes to commit"
          # main may have moved while the (long) stats scan ran; rebase our
          # commit onto the new tip instead of letting the push get rejected
          git pull --rebase origin main
          git push
